# docker-compose.prod.yml
version: "3.8"

services:
  # Production MongoDB with security
  mongodb:
    command: ["mongod", "--auth", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports: [] # Remove external port exposure in production

  # Production server configuration
  server:
    build:
      target: production
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI_PROD}
    volumes:
      - uploads_data:/app/uploads
    # Remove development volumes

  # Production client with nginx
  client:
    build:
      target: production
    environment:
      NODE_ENV: production
    volumes: []
    # Remove development volumes

# Production-specific volumes
volumes:
  uploads_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/app/uploads
